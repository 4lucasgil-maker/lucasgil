<!doctype html>
<html lang="pt-BR">
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        #s22 { position: absolute; inset: 0; font-family: Inter, sans-serif; color: #111b21; }
        #s22 .safe { position: absolute; left: 290px; top: 420px; width: 500px; height: 500px; }
        #s22 .shell { position: absolute; inset: 0; border-radius: 40px; background: #3f5b67; box-shadow: 0 22px 44px rgba(17, 27, 33, 0.25); }
        #s22 .inside { position: absolute; left: 34px; top: 34px; width: 432px; height: 432px; border-radius: 24px; background: #1b2a30; overflow: hidden; }
        #s22 .glow { position: absolute; left: 16px; top: 16px; width: 400px; height: 400px; border-radius: 50%; background: radial-gradient(circle, rgba(201, 165, 92, 0.85) 0%, rgba(201, 165, 92, 0) 70%); opacity: 0; }
        #s22 .door { position: absolute; left: 34px; top: 34px; width: 432px; height: 432px; border-radius: 24px; background: #54656f; box-shadow: inset 0 0 0 10px #3b4a54; }
        #s22 .dial { position: absolute; left: 126px; top: 126px; width: 180px; height: 180px; border-radius: 50%; background: #fbfaf7; box-shadow: 0 0 0 12px #3b4a54; }
        #s22 .dial svg { position: absolute; left: 0; top: 0; }
        #s22 .bolt { position: absolute; left: 380px; width: 70px; height: 26px; border-radius: 13px; background: #c9a55c; }
        #s22 .b1 { top: 90px; } #s22 .b2 { top: 316px; }
        #s22 .word { position: absolute; left: 0; top: 330px; width: 1080px; text-align: center; font-family: "League Gothic", sans-serif; font-size: 100px; line-height: 100px; color: #005c4b; text-transform: uppercase; opacity: 0; }
        #s22 .xp { position: absolute; left: 0; top: 0; width: 120px; height: 150px; border-radius: 18px; background: #fbfaf7; color: #005c4b; display: flex; align-items: center; justify-content: center; box-shadow: 0 10px 22px rgba(17, 27, 33, 0.2); opacity: 0; }
        #s22 .mtn { position: absolute; left: 520px; top: 560px; width: 520px; height: 460px; opacity: 0; }
        #s22 .flag { position: absolute; left: 790px; top: 510px; width: 110px; height: 130px; color: #005c4b; opacity: 0; }
        #s22 .hoje { position: absolute; left: 900px; top: 520px; padding: 6px 16px; border-radius: 12px; background: #005c4b; color: #fbfaf7; font-family: "JetBrains Mono", monospace; font-weight: 700; font-size: 30px; line-height: 38px; letter-spacing: 2px; opacity: 0; }
        #s22 .bulb { position: absolute; left: 90px; top: 340px; width: 120px; height: 120px; border-radius: 50%; background: #c9a55c; color: #111b21; display: flex; align-items: center; justify-content: center; opacity: 0; }
        #s22 .ok { position: absolute; left: 470px; top: 1040px; width: 140px; height: 140px; border-radius: 50%; background: #00a884; color: #fbfaf7; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 0 10px #fbfaf7; opacity: 0; }
      </style>
      <div id="s22" data-composition-id="s22" data-width="1080" data-height="1920">
        <div class="word">o segredo</div>
        <svg class="mtn" viewBox="0 0 520 460" aria-hidden="true">
          <path d="M20 450 L300 60 L510 450 Z" fill="#3f5b67"/>
          <path d="M300 60 L245 136 L275 124 L300 150 L325 122 L352 132 Z" fill="#fbfaf7"/>
        </svg>
        <div class="safe">
          <div class="shell"></div>
          <div class="inside"><div class="glow" data-layout-ignore></div></div>
          <div class="door">
            <div class="dial"></div>
            <div class="bolt b1"></div><div class="bolt b2"></div>
          </div>
        </div>
        <div class="xp x1"></div><div class="xp x2"></div><div class="xp x3"></div><div class="xp x4"></div><div class="xp x5"></div>
        <div class="flag"></div>
        <div class="hoje">HOJE</div>
        <div class="bulb"></div>
        <div class="ok"></div>
      </div>
      <script>
        (function () {
          var W = /*@WORDS@*/ [];
          var T = VT.finder(W, "s22");
          var R = document.getElementById("s22");
          var q = function (s) { return R.querySelector(s); };
          var ticks = "";
          for (var i = 0; i < 24; i++) {
            var a = (i / 24) * Math.PI * 2, r1 = 78, r2 = i % 6 ? 66 : 56;
            ticks += '<path d="M' + (90 + r1 * Math.sin(a)).toFixed(1) + " " + (90 - r1 * Math.cos(a)).toFixed(1) + " L" + (90 + r2 * Math.sin(a)).toFixed(1) + " " + (90 - r2 * Math.cos(a)).toFixed(1) + '"/>';
          }
          q(".dial").innerHTML = '<svg width="180" height="180" viewBox="0 0 180 180" fill="none" stroke="#3b4a54" stroke-width="5" stroke-linecap="round" aria-hidden="true">' + ticks +
            '<circle cx="90" cy="90" r="30" fill="#3b4a54" stroke="none"/><path d="M90 26 V46" stroke="#e5484d" stroke-width="8"/></svg>';
          var icons = ["star", "heart", "bulb", "flag", "check"];
          ["x1", "x2", "x3", "x4", "x5"].forEach(function (c, i) { q("." + c).innerHTML = VT.icon(icons[i], { size: 64, stroke: 2.2 }); });
          q(".flag").innerHTML = VT.icon("flag", { size: 120, stroke: 2.6 });
          q(".bulb").innerHTML = VT.icon("bulb", { size: 76, stroke: 2.2 });
          q(".ok").innerHTML = VT.icon("check", { size: 90, stroke: 3.2 });
          var tl = gsap.timeline({ paused: true });
          tl.fromTo(q(".safe"), { opacity: 0, scale: 0.8, y: 40 }, { opacity: 1, scale: 1, y: 0, duration: 0.5, ease: "back.out(1.8)" }, 0.1);
          // o segredo: combinação do cofre
          tl.fromTo(q(".word"), { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.35, ease: "power3.out" }, T("segredo") - 0.2);
          var d = q(".dial"), s0 = T("aí", 2) - 0.2;
          tl.fromTo(d, { rotation: 0 }, { rotation: 210, duration: 0.45, ease: "power2.inOut" }, s0);
          tl.to(d, { rotation: -130, duration: 0.5, ease: "power2.inOut" }, s0 + 0.5);
          tl.to(d, { rotation: 60, duration: 0.4, ease: "power2.inOut" }, s0 + 1.05);
          tl.to([q(".b1"), q(".b2")], { x: -60, duration: 0.25, ease: "power2.in" }, T("né") - 0.15);
          tl.fromTo(q(".door"), { rotationY: 0, transformOrigin: "0% 50%", transformPerspective: 1200 }, { rotationY: -105, duration: 0.7, ease: "power3.inOut" }, T("né"));
          tl.fromTo(q(".glow"), { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.6, ease: "power2.out" }, T("né") + 0.3);
          tl.to(q(".word"), { opacity: 0, y: -20, duration: 0.3 }, T("usar"));
          // tudo o que a gente já viveu sai do cofre
          var arc = [[150, 410], [330, 360], [510, 340], [690, 360], [870, 410]];
          ["x1", "x2", "x3", "x4", "x5"].forEach(function (c, i) {
            tl.fromTo(q("." + c), { opacity: 0, x: 480, y: 600, scale: 0.3, rotation: 0 },
              { opacity: 1, x: arc[i][0] - 60, y: arc[i][1], scale: 1, rotation: (i - 2) * 8, duration: 0.6, ease: "back.out(1.6)" }, T("tudo") - 0.2 + i * 0.1);
          });
          tl.fromTo(q(".bulb"), { opacity: 0, scale: 0.3 }, { opacity: 1, scale: 1, duration: 0.35, ease: "back.out(3)" }, T("inteligente") - 0.1);
          tl.to(q(".bulb"), { opacity: 0, scale: 0.6, duration: 0.3 }, T("encarar") - 0.3);
          // encarar o desafio: cofre recua, montanha aparece, experiências viram degraus
          var e = T("encarar") - 0.3;
          tl.to(q(".safe"), { x: -270, y: 180, scale: 0.55, duration: 0.6, ease: "power3.inOut" }, e);
          tl.fromTo(q(".mtn"), { opacity: 0, y: 120 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, e + 0.1);
          var steps = [[340, 900], [440, 810], [540, 720], [640, 630], [740, 540]];
          ["x1", "x2", "x3", "x4", "x5"].forEach(function (c, i) {
            tl.to(q("." + c), { x: steps[i][0] - 60, y: steps[i][1] - 90, rotation: 0, scale: 0.8, duration: 0.5, ease: "power2.inOut" }, T("desafio") - 0.1 + i * 0.08);
          });
          tl.fromTo(q(".flag"), { opacity: 0, y: -80 }, { opacity: 1, y: 0, duration: 0.45, ease: "bounce.out" }, T("hoje") - 0.3);
          tl.fromTo(q(".hoje"), { opacity: 0, scale: 1.8 }, { opacity: 1, scale: 1, duration: 0.25, ease: "power4.in" }, T("hoje") - 0.05);
          tl.fromTo(q(".ok"), { opacity: 0, scale: 0.3 }, { opacity: 1, scale: 1, duration: 0.4, ease: "back.out(3)" }, T("sentido") - 0.2);
          window.__timelines["s22"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
