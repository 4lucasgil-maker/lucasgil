<!doctype html>
<html lang="pt-BR">
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        #chrome { position: absolute; inset: 0; font-family: Inter, sans-serif; color: #111b21; }
        #chrome .hdr {
          position: absolute; left: 0; top: 0; width: 1920px; height: 112px; background: #fbfaf7;
          box-shadow: 0 8px 28px rgba(17, 27, 33, 0.1); border-bottom: 2px solid rgba(17, 27, 33, 0.06);
        }
        #chrome .segs { position: absolute; left: 24px; top: 8px; width: 1872px; height: 6px; }
        #chrome .sg { position: absolute; top: 0; height: 6px; border-radius: 3px; background: rgba(17, 27, 33, 0.12); overflow: hidden; }
        #chrome .sf { position: absolute; left: 0; top: 0; width: 100%; height: 6px; background: #00a884; }
        #chrome .back { position: absolute; left: 16px; top: 38px; width: 48px; height: 48px; color: #3b4a54; }
        #chrome .av-wrap { position: absolute; left: 74px; top: 24px; width: 76px; height: 76px; }
        #chrome .ringwrap { position: absolute; left: -8px; top: -8px; width: 92px; height: 92px; opacity: 0; }
        #chrome .ring { position: absolute; inset: 0; border-radius: 50%; border: 4px solid #00a884; }
        #chrome .av { position: absolute; inset: 0; border-radius: 50%; overflow: hidden; background: #005c4b; display: flex; align-items: center; justify-content: center; }
        #chrome .av img { width: 100%; height: 100%; object-fit: cover; display: block; }
        #chrome .av .ini { font-weight: 900; font-size: 30px; color: #fbfaf7; letter-spacing: -1px; }
        #chrome .name { position: absolute; left: 172px; top: 26px; font-size: 34px; font-weight: 700; line-height: 42px; white-space: nowrap; }
        #chrome .status { position: absolute; left: 172px; top: 68px; width: 360px; height: 32px; }
        #chrome .st { position: absolute; left: 0; top: 0; font-size: 24px; line-height: 32px; white-space: nowrap; }
        #chrome .st-online { color: #54656f; font-weight: 400; }
        #chrome .st-rec, #chrome .st-typing { color: #005c4b; font-weight: 700; opacity: 0; }
        #chrome .chap { position: absolute; left: 760px; top: 36px; width: 900px; height: 44px; overflow: hidden; }
        #chrome .ch {
          position: absolute; right: 0; top: 0; height: 44px; display: flex; align-items: center; gap: 14px; white-space: nowrap;
          font-family: "JetBrains Mono", monospace; font-weight: 700; font-size: 24px; line-height: 44px; letter-spacing: 2px; color: #3b4a54; opacity: 0;
        }
        #chrome .ch b { display: block; padding: 0 12px; border-radius: 10px; background: #d9fdd3; color: #005c4b; font-weight: 700; }
        #chrome .chip {
          position: absolute; right: 28px; top: 32px; padding: 6px 18px; border-radius: 14px; background: #005c4b; color: #fbfaf7;
          font-family: "JetBrains Mono", monospace; font-weight: 700; font-size: 26px; line-height: 40px; white-space: nowrap;
        }
        #chrome .flies { position: absolute; left: 0; top: 150px; width: 1920px; height: 90px; }
        #chrome .fly { position: absolute; left: 0; top: 0; width: 1920px; height: 90px; display: flex; justify-content: center; opacity: 0; }
        #chrome .fly span {
          display: block; padding: 14px 30px; border-radius: 22px; background: #111b21; color: #fbfaf7; white-space: nowrap;
          font-family: "JetBrains Mono", monospace; font-weight: 700; font-size: 40px; line-height: 52px; letter-spacing: 3px;
          box-shadow: 0 14px 32px rgba(17, 27, 33, 0.25);
        }
        #chrome .fly b { color: #d9fdd3; font-weight: 700; }
        #chrome .comp { position: absolute; left: 0; top: 966px; width: 1920px; height: 106px; }
        #chrome .pill {
          position: absolute; left: 24px; top: 6px; width: 1752px; height: 88px; border-radius: 44px; background: #fbfaf7;
          box-shadow: 0 10px 30px rgba(17, 27, 33, 0.14); overflow: hidden;
        }
        #chrome .recrow { position: absolute; inset: 0; }
        #chrome .dot { position: absolute; left: 38px; top: 31px; width: 26px; height: 26px; border-radius: 50%; background: #e5484d; }
        #chrome .timer { position: absolute; left: 80px; top: 20px; font-family: "JetBrains Mono", monospace; font-weight: 700; font-size: 38px; line-height: 48px; color: #111b21; }
        #chrome .wave { position: absolute; left: 214px; top: 12px; width: 1504px; height: 64px; overflow: hidden; }
        #chrome .wave-in { position: absolute; left: 0; top: 0; width: 1560px; height: 64px; }
        #chrome .bar { position: absolute; top: 0; width: 7px; height: 64px; border-radius: 4px; background: #54656f; transform-origin: 50% 50%; }
        #chrome .ph { position: absolute; left: 44px; top: 20px; opacity: 0; font-size: 34px; line-height: 48px; color: #54656f; white-space: nowrap; }
        #chrome .btn { position: absolute; left: 1796px; top: 6px; width: 88px; height: 88px; }
        #chrome .btn-pulse { position: absolute; inset: 0; border-radius: 50%; background: #00a884; box-shadow: 0 10px 26px rgba(0, 92, 75, 0.35); }
        #chrome .ico { position: absolute; left: 20px; top: 20px; width: 48px; height: 48px; color: #fbfaf7; }
      </style>
      <div id="chrome" data-composition-id="chrome" data-width="1920" data-height="1080">
        <div class="hdr">
          <div class="segs"></div>
          <div class="back"></div>
          <div class="av-wrap">
            <div class="ringwrap"><div class="ring"></div></div>
            <div class="av">/*@AVATAR@*/</div>
          </div>
          <div class="name">Cris Junqueira</div>
          <div class="status">
            <div class="st st-online" data-layout-allow-overlap>online</div>
            <div class="st st-rec" data-layout-allow-overlap>gravando áudio…</div>
            <div class="st st-typing" data-layout-allow-overlap>digitando…</div>
          </div>
          <div class="chap"></div>
          <div class="chip">EP /*@EP@*/</div>
        </div>
        <div class="flies"></div>
        <div class="comp">
          <div class="pill">
            <div class="recrow">
              <div class="dot"></div>
              <div class="timer">0:00</div>
              <div class="wave"><div class="wave-in" data-layout-allow-overflow></div></div>
            </div>
            <div class="ph">Mensagem</div>
          </div>
          <div class="btn">
            <div class="btn-pulse"></div>
            <div class="ico ico-mic"></div>
            <div class="ico ico-send"></div>
          </div>
        </div>
      </div>
      <script>
        (function () {
          var D = /*@DATA@*/ {};
          var root = document.getElementById("chrome");
          var q = function (s) { return root.querySelector(s); };
          q(".back").innerHTML = VT.icon("back", { size: 48, stroke: 2.4 });
          q(".ico-mic").innerHTML = VT.icon("mic", { size: 48, stroke: 2.2 });
          q(".ico-send").innerHTML = VT.icon("send", { size: 48, stroke: 2.2 });
          var waveIn = q(".wave-in");
          var NB = 101, PITCH = 15;
          var bars = [];
          for (var i = 0; i < NB; i++) {
            var b = document.createElement("div");
            b.className = "bar";
            b.style.left = i * PITCH + "px";
            waveIn.appendChild(b);
            bars.push(b);
          }
          var env = D.env, rate = D.rate;
          var timer = q(".timer"), dot = q(".dot"), ring = q(".ring"), pulse = q(".btn-pulse");
          var E = function (k) { return k < 0 || k >= env.length ? 0 : env[k]; };
          var tl = gsap.timeline({ paused: true });
          var proxy = { t: 0 };
          var paint = function () {
            var t = proxy.t;
            var f = t * rate, k = Math.floor(f), fr = f - k;
            for (var j = 0; j < NB; j++) bars[j].style.transform = "scaleY(" + ((7 + 57 * E(k - NB + 1 + j)) / 64).toFixed(3) + ")";
            waveIn.style.transform = "translateX(" + (-fr * PITCH).toFixed(2) + "px)";
            var a = E(k);
            pulse.style.transform = "scale(" + (1 + 0.1 * a).toFixed(3) + ")";
            ring.style.transform = "scale(" + (1 + 0.12 * a).toFixed(3) + ")";
            ring.style.opacity = (0.35 + 0.65 * a).toFixed(3);
            timer.textContent = VT.mmss(t);
            dot.style.opacity = Math.floor(t * 2) % 2 ? "0.25" : "1";
          };
          paint();
          tl.fromTo(proxy, { t: 0 }, { t: D.audioEnd, duration: D.audioEnd, ease: "none", onUpdate: paint, immediateRender: false }, 0);

          // status do header
          var ST = { online: q(".st-online"), rec: q(".st-rec"), typing: q(".st-typing") };
          var keys = ["online", "rec", "typing"];
          for (var s = 1; s < D.status.length; s++) {
            var at = D.status[s][0], want = D.status[s][1];
            keys.forEach(function (k) { tl.to(ST[k], { opacity: k === want ? 1 : 0, duration: 0.18, ease: "power1.out" }, at); });
          }
          tl.to(q(".ringwrap"), { opacity: 1, duration: 0.3 }, D.firstWord);

          // capítulos: barras segmentadas (estilo status) + rótulo que troca + selo que voa até o header
          var CH = D.chapters || [];
          var segs = q(".segs"), chap = q(".chap"), flies = q(".flies");
          var GAP = 8, W = 1872, total = D.total;
          var x = 0;
          var two = function (v) { return (v < 10 ? "0" : "") + v; };
          CH.forEach(function (c, n) {
            var t0 = c[0], t1 = n + 1 < CH.length ? CH[n + 1][0] : total;
            var w = Math.max(20, (W - GAP * (CH.length - 1)) * (t1 - t0) / total);
            var sg = document.createElement("div");
            sg.className = "sg";
            sg.style.left = x + "px";
            sg.style.width = w + "px";
            sg.innerHTML = '<div class="sf sf' + n + '"></div>';
            segs.appendChild(sg);
            x += w + GAP;
            var sf = sg.querySelector(".sf");
            gsap.set(sf, { scaleX: 0, transformOrigin: "0% 50%" });
            tl.fromTo(sf, { scaleX: 0 }, { scaleX: 1, duration: Math.max(0.1, t1 - t0), ease: "none", immediateRender: false }, t0);
            var lab = document.createElement("div");
            lab.className = "ch ch" + n;
            lab.setAttribute("data-layout-allow-overlap", "");
            lab.innerHTML = "<b>" + two(n + 1) + "/" + two(CH.length) + "</b>" + c[1];
            chap.appendChild(lab);
            var tin = n === 0 ? Math.max(0.6, t0) : t0 + 1.25;
            tl.fromTo(lab, { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.3, ease: "back.out(2)", immediateRender: false }, tin);
            if (n + 1 < CH.length) tl.to(lab, { opacity: 0, y: -30, duration: 0.25, ease: "power2.in" }, CH[n + 1][0] + 1.0);
            // selo de capítulo: aparece no topo do palco e voa encolhendo até o rótulo do header (a partir do 2º)
            if (n === 0) return;
            var fl = document.createElement("div");
            fl.className = "fly fly" + n;
            fl.setAttribute("data-layout-allow-overlap", "");
            fl.innerHTML = "<span><b>" + two(n + 1) + "</b> · " + c[1] + "</span>";
            flies.appendChild(fl);
            tl.fromTo(fl, { opacity: 0, y: 30, x: 0, scale: 0.7 }, { opacity: 1, y: 0, scale: 1, duration: 0.35, ease: "back.out(2.2)", immediateRender: false }, t0);
            tl.to(fl, { y: -112, x: 380, scale: 0.5, opacity: 0, duration: 0.45, ease: "power3.in" }, t0 + 0.85);
          });

          // envio no fim do áudio
          var T0 = D.audioEnd;
          gsap.set(q(".ico-send"), { opacity: 0, rotation: -90, scale: 0.4 });
          gsap.set(q(".ph"), { x: 40 });
          tl.to(q(".ico-mic"), { opacity: 0, rotation: 90, scale: 0.4, duration: 0.25, ease: "power2.in" }, T0 - 0.5);
          tl.to(q(".ico-send"), { opacity: 1, rotation: 0, scale: 1, duration: 0.3, ease: "back.out(2)" }, T0 - 0.3);
          tl.fromTo(q(".btn"), { scale: 1 }, { scale: 0.84, duration: 0.1, ease: "power2.in", immediateRender: false }, T0);
          tl.to(q(".btn"), { scale: 1, duration: 0.35, ease: "back.out(3)" }, T0 + 0.1);
          tl.to(q(".recrow"), { x: -160, opacity: 0, duration: 0.3, ease: "power2.in" }, T0 + 0.05);
          tl.to(q(".ph"), { opacity: 1, x: 0, duration: 0.35, ease: "power2.out" }, T0 + 0.3);
          tl.to(q(".ringwrap"), { opacity: 0, duration: 0.3 }, T0);
          tl.to(q(".ico-send"), { opacity: 0, rotation: 90, scale: 0.4, duration: 0.2, ease: "power2.in" }, T0 + 0.6);
          tl.to(q(".ico-mic"), { opacity: 1, rotation: 0, scale: 1, duration: 0.3, ease: "back.out(2)" }, T0 + 0.75);

          // cena escura: chrome recolhe e volta
          if (D.dark) {
            var d0 = D.dark[0], d1 = D.dark[1];
            tl.to(q(".hdr"), { y: -140, duration: 0.5, ease: "power2.in" }, d0 - 0.2);
            tl.to(q(".comp"), { y: 160, duration: 0.5, ease: "power2.in" }, d0 - 0.2);
            tl.to(q(".hdr"), { y: 0, duration: 0.6, ease: "power3.out" }, d1 - 0.35);
            tl.to(q(".comp"), { y: 0, duration: 0.6, ease: "power3.out" }, d1 - 0.35);
          }
          window.__timelines["chrome"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
