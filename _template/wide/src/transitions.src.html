<!doctype html>
<html lang="pt-BR">
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        #transitions { position: absolute; inset: 0; overflow: hidden; pointer-events: none; }
        #transitions .iris { position: absolute; inset: 0; }
        #transitions .blade { position: absolute; left: -240px; top: -360px; width: 2400px; height: 1800px; }
        #transitions .strip { position: absolute; top: 0; width: 241px; height: 1080px; }
        #transitions .blk { position: absolute; width: 193px; height: 181px; border-radius: 18px; }
        #transitions .door { position: absolute; top: 0; width: 962px; height: 1080px; }
        #transitions .stripe { position: absolute; top: -300px; width: 420px; height: 1680px; }
      </style>
      <div id="transitions" data-composition-id="transitions" data-width="1920" data-height="1080"></div>
      <script>
        (function () {
          var D = /*@DATA@*/ {};
          var root = document.getElementById("transitions");
          var tl = gsap.timeline({ paused: true });
          var mk = function (cls, css) {
            var e = document.createElement("div");
            e.className = cls;
            e.setAttribute("data-layout-ignore", "");
            for (var k in css) e.style[k] = css[k];
            root.appendChild(e);
            return e;
          };
          D.cuts.forEach(function (c) {
            var t = c.t;
            if (c.type === "iris") {
              var a = c.p0, b = c.p1;
              var el = mk("iris", { background: c.color, clipPath: "circle(0px at " + a[0] + "px " + a[1] + "px)" });
              tl.fromTo(el, { clipPath: "circle(0px at " + a[0] + "px " + a[1] + "px)" },
                { clipPath: "circle(2300px at " + a[0] + "px " + a[1] + "px)", duration: 0.34, ease: "power2.in", immediateRender: false }, t - 0.34);
              tl.set(el, { clipPath: "circle(2300px at " + b[0] + "px " + b[1] + "px)" }, t);
              tl.to(el, { clipPath: "circle(0px at " + b[0] + "px " + b[1] + "px)", duration: 0.38, ease: "power2.out" }, t + 0.04);
            } else if (c.type === "blade") {
              var b1 = mk("blade", { background: c.color });
              var b2 = mk("blade", { background: c.color2 });
              [b1, b2].forEach(function (bl, j) {
                var off = j === 0 ? -0.07 : 0;
                gsap.set(bl, { x: -2700, rotation: 18 });
                tl.fromTo(bl, { x: -2700, rotation: 18 }, { x: 0, duration: 0.36, ease: "power3.in", immediateRender: false }, t - 0.36 + off);
                tl.to(bl, { x: 2700, duration: 0.42, ease: "power3.out" }, t + 0.03 + off);
              });
            } else if (c.type === "blinds") {
              for (var i = 0; i < 8; i++) {
                var s = mk("strip", { left: i * 240 + "px", background: i % 2 ? c.color2 : c.color });
                gsap.set(s, { scaleY: 0, transformOrigin: "50% 0%" });
                tl.fromTo(s, { scaleY: 0, transformOrigin: "50% 0%" }, { scaleY: 1, duration: 0.26, ease: "power2.in", immediateRender: false }, t - 0.26 - (7 - i) * 0.022);
                tl.set(s, { transformOrigin: "50% 100%" }, t + 0.01);
                tl.to(s, { scaleY: 0, duration: 0.3, ease: "power2.out" }, t + 0.03 + i * 0.022);
              }
            } else if (c.type === "blocks") {
              var cx = c.p0[0], cy = c.p0[1];
              for (var r = 0; r < 6; r++) for (var q = 0; q < 10; q++) {
                var x = q * 192, y = r * 180;
                var d = Math.hypot(x + 96 - cx, y + 90 - cy) / 2200;
                var blk = mk("blk", { left: x + "px", top: y + "px", background: (r + q) % 2 ? c.color2 : c.color });
                gsap.set(blk, { scale: 0 });
                tl.fromTo(blk, { scale: 0 }, { scale: 1.08, duration: 0.2, ease: "power2.in", immediateRender: false }, t - 0.2 - (0.16 - 0.16 * d));
                tl.to(blk, { scale: 0, duration: 0.26, ease: "power2.out" }, t + 0.03 + 0.16 * d);
              }
            } else if (c.type === "doors") {
              var dl = mk("door", { left: "0px", background: c.color });
              var dr = mk("door", { left: "958px", background: c.color2 });
              gsap.set(dl, { x: -980 });
              gsap.set(dr, { x: 980 });
              tl.fromTo(dl, { x: -980 }, { x: 0, duration: 0.3, ease: "power3.in", immediateRender: false }, t - 0.3);
              tl.fromTo(dr, { x: 980 }, { x: 0, duration: 0.3, ease: "power3.in", immediateRender: false }, t - 0.3);
              tl.to(dl, { y: -1100, duration: 0.4, ease: "power3.out" }, t + 0.04);
              tl.to(dr, { y: 1100, duration: 0.4, ease: "power3.out" }, t + 0.04);
            } else if (c.type === "stripes") {
              for (var k = 0; k < 8; k++) {
                var st = mk("stripe", { left: k * 300 - 200 + "px", background: k % 2 ? c.color2 : c.color });
                gsap.set(st, { rotation: 20, yPercent: 110 });
                tl.fromTo(st, { rotation: 20, yPercent: 110 }, { yPercent: 0, duration: 0.28, ease: "power3.in", immediateRender: false }, t - 0.28 - (7 - k) * 0.025);
                tl.to(st, { yPercent: -110, duration: 0.34, ease: "power3.out" }, t + 0.03 + k * 0.025);
              }
            }
          });
          window.__timelines["transitions"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
