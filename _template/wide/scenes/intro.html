<!doctype html>
<html lang="pt-BR">
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        #__ID__ { position: absolute; inset: 0; font-family: Inter, sans-serif; color: #111b21; }
        #__ID__ .avwrap { position: absolute; left: 300px; top: 300px; width: 320px; height: 320px; }
        #__ID__ .rg { position: absolute; left: 0; top: 0; width: 320px; height: 320px; border-radius: 50%; border: 6px solid #00a884; opacity: 0; }
        #__ID__ .av { position: absolute; left: 0; top: 0; width: 320px; height: 320px; border-radius: 50%; overflow: hidden; background: #005c4b; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 0 10px #fbfaf7, 0 18px 40px rgba(17, 27, 33, 0.2); }
        #__ID__ .av img { width: 100%; height: 100%; object-fit: cover; display: block; }
        #__ID__ .av .ini { font-weight: 900; font-size: 130px; color: #fbfaf7; letter-spacing: -3px; }
        #__ID__ .mic { position: absolute; left: 236px; top: 236px; width: 84px; height: 84px; border-radius: 50%; background: #00a884; box-shadow: 0 0 0 7px #fbfaf7; display: flex; align-items: center; justify-content: center; color: #fbfaf7; }
        #__ID__ .hi { position: absolute; left: 720px; top: 236px; width: 1000px; font-weight: 700; font-size: 60px; line-height: 72px; color: #3b4a54; }
        #__ID__ .hi .w { display: inline-block; }
        #__ID__ .nm { position: absolute; left: 716px; top: 312px; width: 1100px; height: 200px; display: flex; gap: 30px; font-family: "League Gothic", sans-serif; font-size: 190px; line-height: 200px; color: #111b21; text-transform: uppercase; letter-spacing: 1px; }
        #__ID__ .nm .w { display: block; height: 200px; }
        #__ID__ .brand { position: absolute; left: 720px; top: 540px; width: 830px; height: 104px; background: #d9fdd3; border-radius: 30px; border-top-right-radius: 8px; box-shadow: 0 8px 22px rgba(17, 27, 33, 0.14); }
        #__ID__ .brand::before { content: ""; position: absolute; top: 0; right: -18px; border-left: 22px solid #d9fdd3; border-bottom: 22px solid transparent; }
        #__ID__ .bt { position: absolute; left: 34px; top: 20px; font-weight: 700; font-size: 50px; line-height: 62px; white-space: nowrap; }
        #__ID__ .bt .w { display: inline-block; }
        #__ID__ .bm { position: absolute; right: 24px; bottom: 14px; display: flex; align-items: center; gap: 8px; font-size: 26px; line-height: 32px; color: #54656f; }
        #__ID__ .tkw { position: relative; width: 34px; height: 21px; }
        #__ID__ .tkw svg { position: absolute; left: 0; top: 0; }
        #__ID__ .tkw .tk-blue { opacity: 0; }
        #__ID__ .chip { position: absolute; left: 720px; top: 690px; display: flex; }
        #__ID__ .chip span { display: block; padding: 12px 26px; border-radius: 16px; background: #005c4b; color: #fbfaf7; font-family: "JetBrains Mono", monospace; font-weight: 700; font-size: 32px; line-height: 40px; letter-spacing: 1px; white-space: nowrap; }
      </style>
      <div id="__ID__" data-composition-id="__ID__" data-width="1920" data-height="1080">
        <div class="avwrap">
          <div class="rg rg1" data-layout-ignore></div>
          <div class="rg rg2" data-layout-ignore></div>
          <div class="rg rg3" data-layout-ignore></div>
          <div class="av">/*@AVATAR@*/</div>
          <div class="mic"></div>
        </div>
        <div class="hi"><span class="w w1">Olá,</span> <span class="w w2">eu</span> <span class="w w3">sou</span> <span class="w w4">a</span></div>
        <div class="nm"><span class="w n1">Cris</span> <span class="w n2">Junqueira</span></div>
        <div class="brand">
          <div class="bt"><span class="w b1">Vou</span> <span class="w b2">te</span> <span class="w b3">mandar</span> <span class="w b4">um</span> <span class="w b5">áudio</span></div>
          <div class="bm">08:20 <span class="tkw"></span></div>
        </div>
        <div class="chip"><span>EP #/*@EP@*/ · /*@NAMEUP@*/</span></div>
      </div>
      <script>
        (function () {
          var W = /*@WORDS@*/ [];
          var T = VT.finder(W, "__ID__");
          var R = document.getElementById("__ID__");
          var q = function (s) { return R.querySelector(s); };
          q(".mic").innerHTML = VT.icon("mic", { size: 46, stroke: 2.4 });
          q(".tkw").innerHTML = VT.ticks({ cls: "tk-grey", color: "#54656f" }) + VT.ticks({ cls: "tk-blue", color: "#53bdeb" });
          var tl = gsap.timeline({ paused: true });
          tl.fromTo(q(".avwrap"), { scale: 0.6, opacity: 0, y: 40 }, { scale: 1, opacity: 1, y: 0, duration: 0.5, ease: "back.out(1.8)" }, 0.02);
          tl.fromTo(q(".mic"), { scale: 0 }, { scale: 1, duration: 0.35, ease: "back.out(3)" }, 0.3);
          ["rg1", "rg2", "rg3"].forEach(function (c, i) {
            tl.fromTo(q("." + c), { scale: 1, opacity: 0.6 }, { scale: 1.75, opacity: 0, duration: 1.3, ease: "power1.out", repeat: 2, immediateRender: false }, T("Olá") + i * 0.42);
          });
          [["w1", "Olá"], ["w2", "eu"], ["w3", "sou"], ["w4", "a"]].forEach(function (p) {
            tl.fromTo(q("." + p[0]), { opacity: 0, y: 26 }, { opacity: 1, y: 0, duration: 0.22, ease: "power3.out" }, T(p[1]) - 0.05);
          });
          tl.fromTo(q(".n1"), { opacity: 0, y: 60, scale: 1.25 }, { opacity: 1, y: 0, scale: 1, duration: 0.3, ease: "power4.out" }, T("Cris") - 0.05);
          tl.fromTo(q(".n2"), { opacity: 0, y: 60, scale: 1.25 }, { opacity: 1, y: 0, scale: 1, duration: 0.3, ease: "power4.out" }, T("Junqueira") - 0.05);
          tl.fromTo(q(".brand"), { opacity: 0, y: 50, scale: 0.9 }, { opacity: 1, y: 0, scale: 1, duration: 0.35, ease: "back.out(1.7)", transformOrigin: "100% 100%" }, T("e") - 0.1);
          [["b1", "vou"], ["b2", "te"], ["b3", "mandar"], ["b4", "um"], ["b5", "áudio"]].forEach(function (p) {
            tl.fromTo(q("." + p[0]), { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.16, ease: "power2.out" }, T(p[1]) - 0.04);
          });
          tl.to(q(".tk-blue"), { opacity: 1, duration: 0.2 }, T("áudio") + 0.5);
          tl.fromTo(q(".chip span"), { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.35, ease: "power3.out" }, T("áudio") + 0.3);
          tl.to(q(".avwrap"), { y: -10, duration: 1.2, ease: "sine.inOut" }, T("áudio") - 0.2);
          window.__timelines["__ID__"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
