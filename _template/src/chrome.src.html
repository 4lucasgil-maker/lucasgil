<!doctype html>
<html lang="pt-BR">
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        #chrome { position: absolute; inset: 0; font-family: Inter, sans-serif; color: #111b21; }
        #chrome .hdr {
          position: absolute; left: 0; top: 0; width: 1080px; height: 290px; background: #fbfaf7;
          box-shadow: 0 8px 28px rgba(17, 27, 33, 0.1); border-bottom: 2px solid rgba(17, 27, 33, 0.06);
        }
        #chrome .back { position: absolute; left: 22px; top: 176px; width: 60px; height: 60px; color: #3b4a54; }
        #chrome .av-wrap { position: absolute; left: 92px; top: 142px; width: 128px; height: 128px; }
        #chrome .ringwrap { position: absolute; left: -12px; top: -12px; width: 152px; height: 152px; opacity: 0; }
        #chrome .ring { position: absolute; inset: 0; border-radius: 50%; border: 5px solid #00a884; }
        #chrome .av { position: absolute; inset: 0; border-radius: 50%; overflow: hidden; background: #005c4b; display: flex; align-items: center; justify-content: center; }
        #chrome .av img { width: 100%; height: 100%; object-fit: cover; display: block; }
        #chrome .av .ini { font-weight: 900; font-size: 50px; color: #fbfaf7; letter-spacing: -1px; }
        #chrome .name { position: absolute; left: 250px; top: 148px; font-size: 50px; font-weight: 700; line-height: 60px; white-space: nowrap; }
        #chrome .status { position: absolute; left: 250px; top: 212px; width: 520px; height: 46px; }
        #chrome .st { position: absolute; left: 0; top: 0; font-size: 34px; line-height: 44px; white-space: nowrap; }
        #chrome .st-online { color: #54656f; font-weight: 400; }
        #chrome .st-rec, #chrome .st-typing { color: #005c4b; font-weight: 700; opacity: 0; }
        #chrome .chip {
          position: absolute; right: 36px; top: 172px; padding: 12px 22px; border-radius: 18px; background: #005c4b; color: #fbfaf7;
          font-family: "JetBrains Mono", monospace; font-weight: 700; font-size: 32px; line-height: 40px; white-space: nowrap;
        }
        #chrome .comp { position: absolute; left: 0; top: 1478px; width: 1080px; height: 170px; }
        #chrome .pill {
          position: absolute; left: 28px; top: 12px; width: 862px; height: 146px; border-radius: 73px; background: #fbfaf7;
          box-shadow: 0 10px 30px rgba(17, 27, 33, 0.14); overflow: hidden;
        }
        #chrome .recrow { position: absolute; inset: 0; }
        #chrome .dot { position: absolute; left: 48px; top: 60px; width: 26px; height: 26px; border-radius: 50%; background: #e5484d; }
        #chrome .timer { position: absolute; left: 94px; top: 44px; font-family: "JetBrains Mono", monospace; font-weight: 700; font-size: 46px; line-height: 58px; color: #111b21; }
        #chrome .wave { position: absolute; left: 250px; top: 20px; width: 582px; height: 106px; overflow: hidden; }
        #chrome .wave-in { position: absolute; left: 0; top: 0; width: 620px; height: 106px; }
        #chrome .bar { position: absolute; bottom: 0; width: 8px; border-radius: 4px; background: #54656f; }
        #chrome .ph { position: absolute; left: 56px; top: 44px; opacity: 0; font-size: 42px; line-height: 58px; color: #54656f; white-space: nowrap; }
        #chrome .btn { position: absolute; left: 904px; top: 12px; width: 146px; height: 146px; }
        #chrome .btn-pulse { position: absolute; inset: 0; border-radius: 50%; background: #00a884; box-shadow: 0 10px 26px rgba(0, 92, 75, 0.35); }
        #chrome .ico { position: absolute; left: 39px; top: 39px; width: 68px; height: 68px; color: #fbfaf7; }
      </style>
      <div id="chrome" data-composition-id="chrome" data-width="1080" data-height="1920">
        <div class="hdr">
          <div class="back"></div>
          <div class="av-wrap">
            <div class="ringwrap"><div class="ring"></div></div>
            <div class="av">/*@AVATAR@*/</div>
          </div>
          <div class="name">Cris Junqueira</div>
          <div class="status">
            <div class="st st-online" data-layout-allow-overlap>online</div>
            <div class="st st-rec" data-layout-allow-overlap>gravando áudio…</div>
            <div class="st st-typing" data-layout-allow-overlap>digitando…</div>
          </div>
          <div class="chip">EP /*@EP@*/</div>
        </div>
        <div class="comp">
          <div class="pill">
            <div class="recrow">
              <div class="dot"></div>
              <div class="timer">0:00</div>
              <div class="wave"><div class="wave-in" data-layout-allow-overflow></div></div>
            </div>
            <div class="ph">Mensagem</div>
          </div>
          <div class="btn">
            <div class="btn-pulse"></div>
            <div class="ico ico-mic"></div>
            <div class="ico ico-send"></div>
          </div>
        </div>
      </div>
      <script>
        (function () {
          var D = /*@DATA@*/ {};
          var root = document.getElementById("chrome");
          var q = function (s) { return root.querySelector(s); };
          q(".back").innerHTML = VT.icon("back", { size: 60, stroke: 2.4 });
          q(".ico-mic").innerHTML = VT.icon("mic", { size: 68, stroke: 2.2 });
          q(".ico-send").innerHTML = VT.icon("send", { size: 68, stroke: 2.2 });
          var waveIn = q(".wave-in");
          var NB = 35, PITCH = 17;
          var bars = [];
          for (var i = 0; i < NB; i++) {
            var b = document.createElement("div");
            b.className = "bar";
            b.style.left = i * PITCH + "px";
            b.style.height = "8px";
            waveIn.appendChild(b);
            bars.push(b);
          }
          var env = D.env, rate = D.rate;
          var timer = q(".timer"), dot = q(".dot"), ring = q(".ring"), pulse = q(".btn-pulse");
          var E = function (k) { return k < 0 || k >= env.length ? 0 : env[k]; };
          var tl = gsap.timeline({ paused: true });
          var proxy = { t: 0 };
          var paint = function () {
            var t = proxy.t;
            var f = t * rate, k = Math.floor(f), fr = f - k;
            for (var j = 0; j < NB; j++) bars[j].style.height = Math.round(8 + 98 * E(k - NB + 1 + j)) + "px";
            waveIn.style.transform = "translateX(" + (-fr * PITCH).toFixed(2) + "px)";
            var a = E(k);
            pulse.style.transform = "scale(" + (1 + 0.1 * a).toFixed(3) + ")";
            ring.style.transform = "scale(" + (1 + 0.12 * a).toFixed(3) + ")";
            ring.style.opacity = (0.35 + 0.65 * a).toFixed(3);
            timer.textContent = VT.mmss(t);
            dot.style.opacity = Math.floor(t * 2) % 2 ? "0.25" : "1";
          };
          tl.fromTo(proxy, { t: 0 }, { t: D.audioEnd, duration: D.audioEnd, ease: "none", onUpdate: paint, immediateRender: false }, 0);

          // status do header
          var ST = { online: q(".st-online"), rec: q(".st-rec"), typing: q(".st-typing") };
          var keys = ["online", "rec", "typing"];
          for (var s = 1; s < D.status.length; s++) {
            var at = D.status[s][0], want = D.status[s][1];
            keys.forEach(function (k) { tl.to(ST[k], { opacity: k === want ? 1 : 0, duration: 0.18, ease: "power1.out" }, at); });
          }
          tl.to(q(".ringwrap"), { opacity: 1, duration: 0.3 }, D.firstWord);

          // envio no fim do áudio
          var T0 = D.audioEnd;
          gsap.set(q(".ico-send"), { opacity: 0, rotation: -90, scale: 0.4 });
          gsap.set(q(".ph"), { x: 40 });
          tl.to(q(".ico-mic"), { opacity: 0, rotation: 90, scale: 0.4, duration: 0.25, ease: "power2.in" }, T0 - 0.5);
          tl.to(q(".ico-send"), { opacity: 1, rotation: 0, scale: 1, duration: 0.3, ease: "back.out(2)" }, T0 - 0.3);
          tl.fromTo(q(".btn"), { scale: 1 }, { scale: 0.84, duration: 0.1, ease: "power2.in", immediateRender: false }, T0);
          tl.to(q(".btn"), { scale: 1, duration: 0.35, ease: "back.out(3)" }, T0 + 0.1);
          tl.to(q(".recrow"), { x: -120, opacity: 0, duration: 0.3, ease: "power2.in" }, T0 + 0.05);
          tl.to(q(".ph"), { opacity: 1, x: 0, duration: 0.35, ease: "power2.out" }, T0 + 0.3);
          tl.to(q(".ringwrap"), { opacity: 0, duration: 0.3 }, T0);
          tl.to(q(".ico-send"), { opacity: 0, rotation: 90, scale: 0.4, duration: 0.2, ease: "power2.in" }, T0 + 0.6);
          tl.to(q(".ico-mic"), { opacity: 1, rotation: 0, scale: 1, duration: 0.3, ease: "back.out(2)" }, T0 + 0.75);

          // cena escura: chrome recolhe e volta
          if (D.dark) {
            var d0 = D.dark[0], d1 = D.dark[1];
            tl.to(q(".hdr"), { y: -330, duration: 0.5, ease: "power2.in" }, d0 - 0.2);
            tl.to(q(".comp"), { y: 600, duration: 0.5, ease: "power2.in" }, d0 - 0.2);
            tl.to(q(".hdr"), { y: 0, duration: 0.6, ease: "power3.out" }, d1 - 0.35);
            tl.to(q(".comp"), { y: 0, duration: 0.6, ease: "power3.out" }, d1 - 0.35);
          }
          window.__timelines["chrome"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
