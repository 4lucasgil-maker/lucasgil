<!doctype html>
<html lang="pt-BR">
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        #s34 { position: absolute; inset: 0; font-family: Inter, sans-serif; color: #111b21; }
        #s34 .cam { position: absolute; inset: 0; }
        #s34 .grid { position: absolute; left: 140px; top: 214px; width: 840px; height: 504px; }
        #s34 .wv { position: absolute; width: 72px; height: 66px; }
        #s34 .tro { position: absolute; left: 140px; top: 142px; width: 840px; text-align: center; font-family: "League Gothic", sans-serif; font-size: 70px; line-height: 70px; color: #e5484d; }
        #s34 .chart { position: absolute; left: 1080px; top: 170px; width: 700px; height: 520px; border-radius: 34px; background: #fbfaf7; box-shadow: 0 18px 40px rgba(17, 27, 33, 0.14); }
        #s34 .chart svg { position: absolute; left: 0; top: 0; }
        #s34 .cl { position: absolute; left: 40px; top: 30px; font-family: "JetBrains Mono", monospace; font-weight: 700; font-size: 26px; line-height: 32px; letter-spacing: 5px; color: #3b4a54; }
        #s34 .ar { position: absolute; left: 1650px; top: 520px; width: 100px; height: 130px; }
      </style>
      <div id="s34" data-composition-id="s34" data-width="1920" data-height="1080">
        <div class="cam">
          <div class="tro">TROCENTOS PROBLEMAS</div>
          <div class="grid"></div>
          <div class="chart">
            <div class="cl">SITUAÇÃO</div>
            <svg width="700" height="520" viewBox="0 0 700 520" aria-hidden="true">
              <path d="M60 90 V460 H660" fill="none" stroke="#3b4a54" stroke-width="6" stroke-linecap="round"/>
              <path class="ln" d="M70 140 H170 L200 190 H290 L320 250 H400 L430 330 H500 L540 440 H640" fill="none" stroke="#e5484d" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </div>
          <svg class="ar" width="100" height="130" viewBox="0 0 100 130" aria-hidden="true"><path d="M50 8 V110 M14 76 L50 118 L86 76" fill="none" stroke="#e5484d" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </div>
      </div>
      <script>
        (function () {
          var W = /*@WORDS@*/ [];
          var T = VT.finder(W, "s34");
          var R = document.getElementById("s34");
          var q = function (s) { return R.querySelector(s); };
          var g = q(".grid");
          // ordem de preenchimento a partir do centro (determinística)
          var cells = [];
          for (var r = 0; r < 6; r++) for (var c = 0; c < 10; c++) cells.push({ r: r, c: c, d: Math.hypot(c - 4.5, (r - 2.5) * 1.3) + ((r * 7 + c * 3) % 5) * 0.05 });
          cells.sort(function (a, b) { return a.d - b.d; });
          var tri = '<svg width="72" height="66" viewBox="0 0 72 66"><path d="M36 4 L68 60 H4 Z" fill="#e5484d" stroke="#111b21" stroke-width="4" stroke-linejoin="round"/><path d="M36 24 V42" stroke="#fbfaf7" stroke-width="7" stroke-linecap="round"/><circle cx="36" cy="51" r="4" fill="#fbfaf7"/></svg>';
          cells.forEach(function (cl, i) { g.insertAdjacentHTML("beforeend", '<div class="wv w' + i + '" style="left:' + (cl.c * 84 + 6) + "px;top:" + (cl.r * 84 + 9) + 'px">' + tri + "</div>"); });
          var tl = gsap.timeline({ paused: true });
          // 1 → 2 → 4 → 8 → 16 → 32 → 60: multiplicação até "trocentos"
          var waves = [[0, 1, T("situação") - 0.1], [1, 2, T("já") - 0.1], [2, 4, T("tinha") - 0.05], [4, 8, T("tido") - 0.05], [8, 16, T("tido") + 0.3], [16, 32, T("trocentos") - 0.05], [32, 60, T("problemas") - 0.2]];
          waves.forEach(function (w) {
            for (var k = w[0]; k < w[1]; k++) {
              tl.fromTo(q(".w" + k), { opacity: 0, scale: 0 }, { opacity: 1, scale: 1, duration: 0.22, ease: "back.out(3)" }, w[2] + (k - w[0]) * Math.min(0.012, 0.3 / (w[1] - w[0])));
            }
          });
          tl.fromTo(q(".tro"), { opacity: 0, scale: 1.4 }, { opacity: 1, scale: 1, duration: 0.25, ease: "power4.out" }, T("trocentos") - 0.05);
          tl.fromTo(q(".grid"), { x: 0 }, { x: 8, duration: 0.05, yoyo: true, repeat: 7, ease: "none", immediateRender: false }, T("problemas"));
          // cada hora piorava: o gráfico despenca
          tl.fromTo(q(".chart"), { opacity: 0, x: 80 }, { opacity: 1, x: 0, duration: 0.4, ease: "power3.out" }, T("e") - 0.3);
          tl.fromTo(q(".ln"), { strokeDasharray: 900, strokeDashoffset: 900 }, { strokeDashoffset: 0, duration: T("situação", 2) - T("cada") + 0.2, ease: "power1.in" }, T("cada") - 0.1);
          tl.fromTo(q(".ar"), { opacity: 0, y: -40 }, { opacity: 1, y: 0, duration: 0.3, ease: "bounce.out" }, T("situação", 2) - 0.05);
          tl.fromTo(q(".cam"), { scale: 1 }, { scale: 1.04, duration: 6, ease: "sine.inOut", transformOrigin: "50% 50%" }, 0.2);
          window.__timelines["s34"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
