<!doctype html>
<html lang="pt-BR">
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        #s36 { position: absolute; inset: 0; font-family: Inter, sans-serif; color: #111b21; perspective: 1400px; }
        #s36 .cam { position: absolute; inset: 0; }
        #s36 .belt { position: absolute; left: 160px; top: 290px; width: 1600px; height: 34px; border-radius: 17px; background: #3b4a54; overflow: hidden; }
        #s36 .belt .stripes { position: absolute; left: 0; top: 0; width: 1700px; height: 34px; }
        #s36 .rl { position: absolute; top: 330px; width: 40px; height: 40px; border-radius: 50%; background: #111b21; }
        #s36 .boxes { position: absolute; left: 160px; top: 190px; width: 1600px; height: 100px; overflow: hidden; }
        #s36 .bx { position: absolute; top: 4px; width: 110px; height: 96px; border-radius: 16px; background: #c9a55c; box-shadow: inset 0 -8px 0 rgba(17, 27, 33, 0.18); display: flex; align-items: center; justify-content: center; color: #111b21; }
        #s36 .bad { background: #e5484d; color: #fbfaf7; }
        #s36 .btn { position: absolute; left: 230px; top: 440px; width: 240px; height: 240px; }
        #s36 .btn .base { position: absolute; left: 0; top: 60px; width: 240px; height: 180px; border-radius: 40px; background: #1b2a30; }
        #s36 .btn .cap { position: absolute; left: 30px; top: 0; width: 180px; height: 180px; border-radius: 50%; background: #e5484d; box-shadow: inset 0 -16px 0 rgba(17, 27, 33, 0.25); display: flex; align-items: center; justify-content: center; font-family: "League Gothic", sans-serif; font-size: 52px; line-height: 50px; text-align: center; color: #fbfaf7; }
        #s36 .flash { position: absolute; inset: 0; background: #e5484d; opacity: 0; }
        #s36 .pt { position: absolute; left: 520px; top: 500px; font-family: "League Gothic", sans-serif; font-size: 110px; line-height: 110px; color: #e5484d; }
        #s36 .cd { position: absolute; top: 420px; width: 340px; height: 300px; border-radius: 34px; background: #fbfaf7; box-shadow: 0 16px 34px rgba(17, 27, 33, 0.14); }
        #s36 .k1 { left: 640px; } #s36 .k2 { left: 1010px; } #s36 .k3 { left: 1380px; }
        #s36 .cd .n { position: absolute; left: 28px; top: 22px; font-family: "JetBrains Mono", monospace; font-weight: 700; font-size: 26px; line-height: 32px; color: #54656f; }
        #s36 .cd .ic { position: absolute; left: 110px; top: 50px; width: 120px; height: 120px; color: #005c4b; }
        #s36 .cd .t { position: absolute; left: 0; top: 190px; width: 340px; text-align: center; font-family: "League Gothic", sans-serif; font-size: 68px; line-height: 72px; color: #111b21; }
        #s36 .cd .ok { position: absolute; right: -16px; top: -16px; width: 64px; height: 64px; border-radius: 50%; background: #00a884; color: #fbfaf7; display: flex; align-items: center; justify-content: center; }
        #s36 .cd .no { position: absolute; right: -16px; top: -16px; width: 64px; height: 64px; border-radius: 50%; background: #e5484d; color: #fbfaf7; display: flex; align-items: center; justify-content: center; }
        #s36 .cur { position: absolute; left: 0; top: 0; width: 56px; height: 70px; }
      </style>
      <div id="s36" data-composition-id="s36" data-width="1920" data-height="1080">
        <div class="cam">
          <div class="boxes"></div>
          <div class="belt"><svg class="stripes" width="1700" height="34" viewBox="0 0 1700 34"></svg></div>
          <div class="rl" style="left:180px"></div><div class="rl" style="left:1700px"></div>
          <div class="btn"><div class="base"></div><div class="cap">PARA<br>TUDO</div></div>
          <div class="pt">PERAÍ!</div>
          <div class="cd k1"><div class="n">01</div><div class="ic"></div><div class="t">REPARAR</div><div class="ok o1"></div><div class="no x1"></div></div>
          <div class="cd k2"><div class="n">02</div><div class="ic"></div><div class="t">ENTENDER</div><div class="ok o2"></div><div class="no x2"></div></div>
          <div class="cd k3"><div class="n">03</div><div class="ic"></div><div class="t">GARANTIR</div><div class="ok o3"></div><div class="no x3"></div></div>
          <div class="flash" data-layout-ignore></div>
          <div class="cur" data-layout-ignore></div>
        </div>
      </div>
      <script>
        (function () {
          var W = /*@WORDS@*/ [];
          var T = VT.finder(W, "s36");
          var DUR = /*@DUR@*/ 0;
          var R = document.getElementById("s36");
          var q = function (s) { return R.querySelector(s); };
          var st = "";
          for (var x = 0; x < 1700; x += 50) st += '<path d="M' + x + ' 34 L' + (x + 24) + ' 0" stroke="#54656f" stroke-width="10"/>';
          q(".stripes").innerHTML = st;
          var bxs = q(".boxes"), N = 9;
          for (var i = 0; i < N; i++) bxs.insertAdjacentHTML("beforeend", '<div class="bx b' + i + (i === 4 ? " bad" : "") + '">' + VT.icon(i === 4 ? "alert" : "doc", { size: 52, stroke: 2.2 }) + "</div>");
          q(".k1 .ic").innerHTML = '<svg width="120" height="120" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 6.5a4 4 0 0 0 5 5L12 19a2.1 2.1 0 0 1-3-3l7.5-7.5a4 4 0 0 0-2-2z"/><path d="M14.5 6.5 17 4l3 3-2.5 2.5"/></svg>';
          q(".k2 .ic").innerHTML = VT.icon("search", { size: 120, stroke: 2 });
          q(".k3 .ic").innerHTML = VT.icon("shield", { size: 120, stroke: 2 });
          for (var k = 1; k <= 3; k++) { q(".o" + k).innerHTML = VT.icon("check", { size: 38, stroke: 3.2 }); q(".x" + k).innerHTML = VT.icon("x", { size: 34, stroke: 3.2 }); }
          q(".cur").innerHTML = VT.cursor({ size: 56 });
          gsap.set(q(".cur"), { x: 700, y: 1120 });
          // esteira: anda até o "para tudo" e trava (posição = função do tempo)
          var tstop = T("para") + 0.05, V = 260, SP = 1600 / N;
          var stripes = q(".stripes"), boxes = [];
          for (var b = 0; b < N; b++) boxes.push(q(".b" + b));
          var tl = gsap.timeline({ paused: true });
          VT.driver(tl, DUR, function (t) {
            var d = V * Math.min(t, tstop) + (t > tstop ? Math.min(14, (t - tstop) * 120) * Math.exp(-(t - tstop) * 8) : 0);
            stripes.style.transform = "translateX(" + (-(d % 50)).toFixed(1) + "px)";
            boxes.forEach(function (el, j) { var xx = ((j * SP + d) % 1600) - 120; el.style.transform = "translateX(" + xx.toFixed(1) + "px)"; });
          });
          tl.fromTo([q(".belt"), q(".boxes")], { opacity: 0 }, { opacity: 1, duration: 0.3 }, 0.02);
          tl.fromTo(q(".btn"), { opacity: 0, y: 60 }, { opacity: 1, y: 0, duration: 0.4, ease: "back.out(2)" }, T("problema") - 0.2);
          tl.fromTo(q(".b4"), { scale: 1 }, { scale: 1.15, duration: 0.15, yoyo: true, repeat: 3, ease: "power2.out", immediateRender: false }, T("problema"));
          // peraí, para tudo: o cursor aperta o botão vermelho
          tl.to(q(".cur"), { x: 360, y: 520, duration: 0.45, ease: "power3.out" }, T("peraí") - 0.3);
          tl.fromTo(q(".pt"), { opacity: 0, scale: 0.5, x: -30 }, { opacity: 1, scale: 1, x: 0, duration: 0.25, ease: "back.out(3)" }, T("peraí") - 0.05);
          var tp = T("para") - 0.05;
          tl.to(q(".cur"), { scale: 0.85, duration: 0.08, yoyo: true, repeat: 1 }, tp);
          tl.fromTo(q(".btn .cap"), { y: 0 }, { y: 34, duration: 0.08, yoyo: true, repeat: 1, ease: "power2.in", immediateRender: false }, tp);
          tl.fromTo(q(".flash"), { opacity: 0.35 }, { opacity: 0, duration: 0.35, ease: "power2.out", immediateRender: false }, tp + 0.08);
          tl.fromTo(q(".cam"), { x: 0 }, { x: 14, duration: 0.04, yoyo: true, repeat: 5, ease: "none" }, tp + 0.08);
          tl.to(q(".cur"), { x: 700, y: 1120, duration: 0.4, ease: "power2.in" }, tp + 0.3);
          tl.to(q(".pt"), { opacity: 0, duration: 0.2 }, tp + 0.5);
          // os três passos
          [["k1", "o1", T("reparar"), T("dano")], ["k2", "o2", T("entender"), T("aconteceu")], ["k3", "o3", T("garantir"), T("escorrega")]].forEach(function (p) {
            tl.fromTo(q("." + p[0]), { opacity: 0, rotationY: -90 }, { opacity: 1, rotationY: 0, duration: 0.4, ease: "back.out(1.6)" }, p[2] - 0.2);
            tl.fromTo(q("." + p[1]), { scale: 0 }, { scale: 1, duration: 0.25, ease: "back.out(3)" }, p[3]);
          });
          // que não foi o caso também: checks viram X
          var tn = T("não") - 0.05;
          for (var m = 1; m <= 3; m++) {
            tl.to(q(".o" + m), { scale: 0, duration: 0.12 }, tn + (m - 1) * 0.12);
            tl.fromTo(q(".x" + m), { scale: 0 }, { scale: 1, duration: 0.22, ease: "back.out(3)" }, tn + 0.08 + (m - 1) * 0.12);
            tl.to(q(".k" + m), { opacity: 0.55, duration: 0.25 }, tn + 0.1 + (m - 1) * 0.12);
          }
          window.__timelines["s36"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
