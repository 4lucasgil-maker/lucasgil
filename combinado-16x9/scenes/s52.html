<!doctype html>
<html lang="pt-BR">
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        #s52 { position: absolute; inset: 0; font-family: Inter, sans-serif; color: #111b21; }
        #s52 .cam { position: absolute; inset: 0; }
        #s52 .hz { position: absolute; left: 0; top: 0; width: 64px; height: 64px; color: #e5484d; }
        #s52 .sunw { position: absolute; left: 200px; top: 180px; width: 360px; height: 300px; overflow: hidden; }
        #s52 .sun { position: absolute; left: 60px; top: 60px; width: 240px; height: 240px; }
        #s52 .hor { position: absolute; left: 160px; top: 478px; width: 440px; height: 10px; border-radius: 5px; background: #3b4a54; }
        #s52 .bd { position: absolute; left: 180px; top: 500px; width: 400px; text-align: center; font-family: "League Gothic", sans-serif; font-size: 80px; line-height: 84px; color: #c9a55c; }
        #s52 .cup { position: absolute; left: 760px; top: 250px; width: 420px; height: 420px; }
        #s52 .stm { position: absolute; left: 0; top: 0; }
        #s52 .go { position: absolute; left: 1250px; top: 330px; font-family: "League Gothic", sans-serif; font-size: 150px; line-height: 150px; color: #005c4b; }
        #s52 .wk { position: absolute; left: 460px; top: 170px; width: 1000px; height: 120px; }
        #s52 .dy { position: absolute; top: 0; width: 180px; height: 120px; border-radius: 24px; background: #fbfaf7; box-shadow: 0 8px 18px rgba(17, 27, 33, 0.1); font-family: "League Gothic", sans-serif; font-size: 64px; line-height: 120px; text-align: center; color: #3b4a54; }
        #s52 .mk { position: absolute; left: 0; top: 136px; width: 1000px; height: 10px; border-radius: 5px; background: #cbc1b2; }
        #s52 .mkf { position: absolute; left: 0; top: 136px; width: 1000px; height: 10px; border-radius: 5px; background: #00a884; }
        #s52 .todo { position: absolute; left: 610px; top: 340px; width: 700px; height: 380px; }
        #s52 .it { position: absolute; left: 0; width: 700px; height: 60px; border-radius: 18px; background: #fbfaf7; box-shadow: 0 6px 14px rgba(17, 27, 33, 0.08); }
        #s52 .it .bx { position: absolute; left: 16px; top: 12px; width: 36px; height: 36px; border-radius: 10px; box-shadow: inset 0 0 0 4px #3b4a54; }
        #s52 .it .ln { position: absolute; left: 72px; top: 23px; height: 14px; border-radius: 7px; background: #cbc1b2; }
        #s52 .tl { position: absolute; left: 1330px; top: 380px; font-family: "League Gothic", sans-serif; font-size: 80px; line-height: 84px; color: #111b21; }
        #s52 .lock { position: absolute; inset: 0; }
        #s52 .lav { position: absolute; left: 560px; top: 210px; width: 220px; height: 220px; border-radius: 50%; overflow: hidden; background: #005c4b; box-shadow: 0 0 0 9px #fbfaf7, 0 18px 40px rgba(17, 27, 33, 0.2); }
        #s52 .lav img { width: 100%; height: 100%; object-fit: cover; display: block; }
        #s52 .brand { position: absolute; left: 840px; top: 230px; width: 800px; height: 104px; background: #d9fdd3; border-radius: 30px; border-top-right-radius: 8px; box-shadow: 0 8px 22px rgba(17, 27, 33, 0.14); }
        #s52 .brand::before { content: ""; position: absolute; top: 0; right: -18px; border-left: 22px solid #d9fdd3; border-bottom: 22px solid transparent; }
        #s52 .bt { position: absolute; left: 34px; top: 20px; font-weight: 700; font-size: 50px; line-height: 62px; white-space: nowrap; }
        #s52 .bm { position: absolute; right: 24px; bottom: 14px; display: flex; align-items: center; gap: 8px; font-size: 26px; line-height: 32px; color: #54656f; }
        #s52 .cp { position: absolute; top: 370px; padding: 12px 24px; border-radius: 16px; font-family: "JetBrains Mono", monospace; font-weight: 700; font-size: 30px; line-height: 40px; letter-spacing: 1px; white-space: nowrap; }
        #s52 .cp1 { left: 840px; background: #005c4b; color: #fbfaf7; }
        #s52 .cp2 { left: 840px; top: 450px; background: #fbfaf7; color: #111b21; box-shadow: inset 0 0 0 4px #111b21; }
      </style>
      <div id="s52" data-composition-id="s52" data-width="1920" data-height="1080">
        <div class="cam">
          <div class="hearts"></div>
          <div class="sunw"><svg class="sun" width="240" height="240" viewBox="0 0 240 240" aria-hidden="true"><g class="sr" stroke="#c9a55c" stroke-width="12" stroke-linecap="round"></g><circle cx="120" cy="120" r="70" fill="#c9a55c"/></svg></div>
          <div class="hor"></div>
          <div class="bd">BOM DIA</div>
          <svg class="cup" width="420" height="420" viewBox="0 0 420 420" aria-hidden="true">
            <g class="stm" fill="none" stroke="#cbc1b2" stroke-width="12" stroke-linecap="round">
              <path class="s1" d="M150 140 C120 110 180 90 150 50"/><path class="s2" d="M210 140 C180 110 240 90 210 50"/><path class="s3" d="M270 140 C240 110 300 90 270 50"/>
            </g>
            <path d="M330 220 C400 220 400 310 320 310" fill="none" stroke="#111b21" stroke-width="18"/>
            <path d="M90 170 H340 V300 C340 350 300 380 250 380 H180 C130 380 90 350 90 300 Z" fill="#fbfaf7" stroke="#111b21" stroke-width="9" stroke-linejoin="round"/>
            <path d="M90 200 H340" stroke="#005c4b" stroke-width="16"/>
            <path d="M60 395 H370" stroke="#111b21" stroke-width="10" stroke-linecap="round"/>
          </svg>
          <div class="go">VAMBORA!</div>
          <div class="wk"></div>
          <div class="todo"></div>
          <div class="tl">MUITA COISA</div>
          <div class="lock">
            <div class="lav">/*@AVATAR@*/</div>
            <div class="brand"><div class="bt">Vou te mandar um áudio</div><div class="bm">08:20 <span class="tks"></span></div></div>
            <div class="cp cp1">EP #/*@EP@*/ · /*@NAMEUP@*/</div>
            <div class="cp cp2">PRÓXIMO ▸</div>
          </div>
        </div>
      </div>
      <script>
        (function () {
          var W = /*@WORDS@*/ [];
          var T = VT.finder(W, "s52");
          var AE = /*@AUDIOEND@*/ 0;
          var R = document.getElementById("s52");
          var q = function (s) { return R.querySelector(s); };
          q(".tks").innerHTML = VT.ticks({ color: "#53bdeb" });
          var sr = "";
          for (var i = 0; i < 12; i++) { var a = i * Math.PI / 6; sr += '<path d="M' + (120 + Math.cos(a) * 88).toFixed(1) + " " + (120 + Math.sin(a) * 88).toFixed(1) + " L" + (120 + Math.cos(a) * 112).toFixed(1) + " " + (120 + Math.sin(a) * 112).toFixed(1) + '"/>'; }
          q(".sr").innerHTML = sr;
          // corações (beijo) em dois momentos
          var hearts = q(".hearts"), H = [[820, 420, -120, -260], [960, 440, 0, -320], [1100, 420, 120, -260], [880, 470, -220, -180], [1040, 470, 220, -180], [960, 400, 40, -400]];
          H.forEach(function (h, k) { hearts.insertAdjacentHTML("beforeend", '<div class="hz h' + k + '" style="left:' + h[0] + "px;top:" + h[1] + 'px">' + VT.icon("heart", { size: 64, stroke: 2, fill: true }) + "</div>"); });
          // semana: SEG–SEX, marcador vai até o meio
          var wk = q(".wk"), DAYS = ["SEG", "TER", "QUA", "QUI", "SEX"];
          DAYS.forEach(function (d, k) { wk.insertAdjacentHTML("beforeend", '<div class="dy d' + k + '" style="left:' + k * 205 + 'px">' + d + "</div>"); });
          wk.insertAdjacentHTML("beforeend", '<div class="mk"></div><div class="mkf"></div>');
          var todo = q(".todo"), LW = [420, 300, 520, 360, 460];
          for (var t = 0; t < 5; t++) todo.insertAdjacentHTML("beforeend", '<div class="it t' + t + '" style="top:' + t * 74 + 'px"><div class="bx"></div><div class="ln" style="width:' + LW[t] + 'px"></div></div>');
          gsap.set(q(".mkf"), { scaleX: 0, transformOrigin: "0% 50%" });
          gsap.set([q(".lav"), q(".brand"), q(".cp1"), q(".cp2")], { opacity: 0 });
          var tl = gsap.timeline({ paused: true });
          var burst = function (t0) {
            H.forEach(function (h, k) {
              tl.fromTo(q(".h" + k), { opacity: 0, x: 0, y: 0, scale: 0.3 }, { opacity: 1, x: h[2], y: h[3], scale: 1, duration: 0.6, ease: "power2.out", immediateRender: false }, t0 + k * 0.04);
              tl.to(q(".h" + k), { opacity: 0, duration: 0.3 }, t0 + 0.6 + k * 0.04);
            });
          };
          gsap.set(R.querySelectorAll(".hz"), { opacity: 0 });
          // um beijo grande
          burst(T("beijo") - 0.1);
          // bom dia: o sol nasce
          tl.fromTo(q(".hor"), { scaleX: 0 }, { scaleX: 1, duration: 0.35, ease: "power3.out" }, T("Bom") - 0.3);
          tl.fromTo(q(".sun"), { y: 260 }, { y: 0, duration: 0.7, ease: "power3.out" }, T("Bom") - 0.2);
          tl.fromTo(q(".sun"), { rotation: 0 }, { rotation: 45, duration: 2.5, ease: "none", immediateRender: false }, T("Bom"));
          tl.fromTo(q(".bd"), { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.3 }, T("dia") - 0.1);
          // café e vambora
          tl.fromTo(q(".cup"), { opacity: 0, y: 80, scale: 0.8 }, { opacity: 1, y: 0, scale: 1, duration: 0.4, ease: "back.out(2)" }, T("café") - 0.3);
          ["s1", "s2", "s3"].forEach(function (s, k) {
            tl.fromTo(q("." + s), { opacity: 0, y: 20 }, { opacity: 0.9, y: -20, duration: 0.7, ease: "sine.out", repeat: 1, immediateRender: false }, T("café") + k * 0.15);
          });
          tl.fromTo(q(".go"), { opacity: 0, x: -60, skewX: -15 }, { opacity: 1, x: 0, skewX: 0, duration: 0.3, ease: "power4.out" }, T("vambora") - 0.1);
          tl.to([q(".cup"), q(".go")], { x: 1400, opacity: 0, duration: 0.45, ease: "power3.in" }, T("vambora") + 0.45);
          tl.to([q(".sunw"), q(".hor"), q(".bd")], { opacity: 0, y: -40, duration: 0.35, ease: "power2.in" }, T("vambora") + 0.45);
          // a semana tá no meio ainda
          for (var d = 0; d < 5; d++) tl.fromTo(q(".d" + d), { opacity: 0, y: -40 }, { opacity: 1, y: 0, duration: 0.25, ease: "back.out(2.4)" }, T("semana") - 0.35 + d * 0.05);
          tl.fromTo(q(".mk"), { opacity: 0 }, { opacity: 1, duration: 0.2 }, T("semana"));
          tl.to(q(".mkf"), { scaleX: 0.5, duration: 0.6, ease: "power2.inOut" }, T("semana"));
          tl.to(q(".d2"), { backgroundColor: "#00a884", color: "#fbfaf7", scale: 1.12, duration: 0.25, ease: "back.out(3)" }, T("meio") - 0.05);
          // muita coisa pra fazer
          for (var k2 = 0; k2 < 5; k2++) tl.fromTo(q(".t" + k2), { opacity: 0, x: 60 }, { opacity: 1, x: 0, duration: 0.2, ease: "power3.out" }, T("muita") - 0.2 + k2 * 0.07);
          tl.fromTo(q(".tl"), { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.25, ease: "back.out(2.6)" }, T("coisa") - 0.05);
          // beijo! e o lockup final
          tl.to([q(".wk"), q(".todo"), q(".tl")], { opacity: 0, y: -40, duration: 0.3, ease: "power2.in" }, T("beijo", 2) - 0.25);
          burst(T("beijo", 2) - 0.05);
          var L = AE - 0.1;
          tl.fromTo(q(".lav"), { opacity: 0, scale: 0.4 }, { opacity: 1, scale: 1, duration: 0.4, ease: "back.out(2.2)", immediateRender: false }, L);
          tl.fromTo(q(".brand"), { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.4, ease: "back.out(1.8)", immediateRender: false }, L + 0.1);
          tl.fromTo(q(".cp1"), { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.3, ease: "power3.out", immediateRender: false }, L + 0.25);
          tl.fromTo(q(".cp2"), { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.3, ease: "power3.out", immediateRender: false }, L + 0.35);
          tl.fromTo(q(".cp2"), { x: 0 }, { x: 8, duration: 0.25, yoyo: true, repeat: 1, ease: "sine.inOut", immediateRender: false }, L + 0.7);
          window.__timelines["s52"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
