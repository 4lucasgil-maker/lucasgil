<!doctype html>
<html lang="pt-BR">
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        #s02 { position: absolute; inset: 0; font-family: Inter, sans-serif; color: #111b21; perspective: 1600px; }
        #s02 .cam { position: absolute; inset: 0; }
        #s02 .card { position: absolute; left: 520px; top: 150px; width: 880px; height: 440px; border-radius: 40px; background: #fbfaf7; box-shadow: 0 24px 50px rgba(17, 27, 33, 0.18); overflow: hidden; }
        #s02 .band { position: absolute; left: 0; top: 0; width: 880px; height: 96px; background: #005c4b; }
        #s02 .ttl { position: absolute; left: 44px; top: 26px; font-family: "JetBrains Mono", monospace; font-weight: 700; font-size: 34px; line-height: 44px; letter-spacing: 4px; color: #fbfaf7; }
        #s02 .pic { position: absolute; left: 50px; top: 140px; width: 220px; height: 220px; border-radius: 30px; overflow: hidden; }
        #s02 .lab { position: absolute; left: 310px; font-family: "JetBrains Mono", monospace; font-weight: 700; font-size: 24px; line-height: 30px; letter-spacing: 3px; color: #54656f; }
        #s02 .val { position: absolute; left: 310px; font-family: "League Gothic", sans-serif; font-size: 84px; line-height: 88px; color: #111b21; text-transform: uppercase; }
        #s02 .l1 { top: 140px; } #s02 .v1 { top: 172px; }
        #s02 .l2 { top: 272px; } #s02 .v2 { top: 304px; }
        #s02 .stamp {
          position: absolute; left: 300px; top: 236px; padding: 4px 28px; border: 10px solid #e5484d; border-radius: 22px; color: #e5484d;
          font-family: "League Gothic", sans-serif; font-size: 100px; line-height: 104px; letter-spacing: 4px; background: rgba(251, 250, 247, 0.6);
        }
        #s02 .tg { position: absolute; left: 660px; top: 640px; width: 600px; height: 110px; border-radius: 55px; background: #fbfaf7; box-shadow: 0 12px 28px rgba(17, 27, 33, 0.14); }
        #s02 .tgl { position: absolute; left: 44px; top: 30px; font-weight: 900; font-size: 40px; line-height: 50px; letter-spacing: 1px; }
        #s02 .sw { position: absolute; left: 424px; top: 23px; width: 140px; height: 64px; border-radius: 32px; background: #cbc1b2; }
        #s02 .swon { position: absolute; inset: 0; border-radius: 32px; background: #00a884; opacity: 0; }
        #s02 .knob { position: absolute; left: 6px; top: 6px; width: 52px; height: 52px; border-radius: 50%; background: #fbfaf7; box-shadow: 0 3px 8px rgba(17, 27, 33, 0.25); }
        #s02 .cur { position: absolute; left: 0; top: 0; width: 56px; height: 70px; }
        #s02 .rip { position: absolute; left: 1145px; top: 650px; width: 90px; height: 90px; border-radius: 50%; border: 5px solid #005c4b; opacity: 0; }
      </style>
      <div id="s02" data-composition-id="s02" data-width="1920" data-height="1080">
        <div class="cam">
          <div class="card">
            <div class="band"><div class="ttl">CARTEIRINHA DE CONSUMIDOR</div></div>
            <div class="pic"></div>
            <div class="lab l1">PAÍS</div>
            <div class="val v1">Brasil</div>
            <div class="lab l2">TRATAMENTO</div>
            <div class="val v2">—</div>
            <div class="stamp" data-layout-allow-overlap>MALTRATADO</div>
          </div>
          <div class="tg">
            <div class="tgl">ACHAR NORMAL</div>
            <div class="sw"><div class="swon"></div><div class="knob"></div></div>
          </div>
          <div class="rip" data-layout-ignore></div>
          <div class="cur" data-layout-ignore></div>
        </div>
      </div>
      <script>
        (function () {
          var W = /*@WORDS@*/ [];
          var T = VT.finder(W, "s02");
          var R = document.getElementById("s02");
          var q = function (s) { return R.querySelector(s); };
          q(".pic").innerHTML = VT.person({ size: 220, bg: "#3f5b67" });
          q(".cur").innerHTML = VT.cursor({ size: 56 });
          gsap.set(q(".stamp"), { opacity: 0 });
          gsap.set(q(".cur"), { x: 1990, y: 700 });
          var tl = gsap.timeline({ paused: true });
          tl.fromTo(q(".card"), { rotationY: -70, opacity: 0, x: -160 }, { rotationY: 0, opacity: 1, x: 0, duration: 0.6, ease: "power3.out" }, 0.05);
          tl.fromTo(q(".pic"), { scale: 0.6, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.35, ease: "back.out(2)" }, 0.4);
          tl.fromTo([q(".l1"), q(".l2")], { opacity: 0, x: -20 }, { opacity: 1, x: 0, duration: 0.3, stagger: 0.08 }, 0.5);
          tl.fromTo(q(".v1"), { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.3, ease: "power3.out" }, T("Brasil") - 0.08);
          tl.fromTo(q(".v2"), { opacity: 0 }, { opacity: 1, duration: 0.2 }, T("Brasil") + 0.1);
          // maltratado: carimbo
          tl.fromTo(q(".stamp"), { opacity: 0, scale: 2.4, rotation: -4 }, { opacity: 1, scale: 1, rotation: -12, duration: 0.24, ease: "power4.in" }, T("maltratado") - 0.1);
          tl.fromTo(q(".card"), { x: 0 }, { x: 14, duration: 0.05, yoyo: true, repeat: 5, ease: "none", immediateRender: false }, T("maltratado") + 0.14);
          tl.fromTo(q(".cam"), { scale: 1 }, { scale: 1.05, duration: 0.18, ease: "power2.out", transformOrigin: "50% 40%" }, T("maltratado") + 0.14);
          tl.to(q(".cam"), { scale: 1, duration: 0.6, ease: "power2.inOut" }, T("maltratado") + 0.4);
          // consumidor: faixa do título acende
          tl.fromTo(q(".band"), { backgroundColor: "#005c4b" }, { backgroundColor: "#e5484d", duration: 0.25, ease: "power2.out" }, T("consumidor") - 0.05);
          tl.fromTo(q(".card"), { scale: 1 }, { scale: 1.04, duration: 0.2, yoyo: true, repeat: 1, ease: "power2.out", immediateRender: false }, T("impressionante") - 0.05);
          // achar normal: o cursor liga o interruptor
          tl.fromTo(q(".tg"), { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.35, ease: "back.out(2)" }, T("acha") - 0.3);
          tl.fromTo(q(".cur"), { x: 1990, y: 700 }, { x: 1150, y: 676, duration: 0.5, ease: "power3.out", immediateRender: false }, T("acha"));
          var c = T("normal") - 0.05;
          tl.fromTo(q(".cur"), { scale: 1 }, { scale: 0.85, duration: 0.08, yoyo: true, repeat: 1, ease: "power2.in", immediateRender: false }, c);
          tl.fromTo(q(".rip"), { opacity: 0.9, scale: 0.4 }, { opacity: 0, scale: 1.6, duration: 0.45, ease: "power2.out", immediateRender: false }, c + 0.06);
          tl.fromTo(q(".knob"), { x: 0 }, { x: 76, duration: 0.22, ease: "back.out(2)" }, c + 0.08);
          tl.fromTo(q(".swon"), { opacity: 0 }, { opacity: 1, duration: 0.2 }, c + 0.08);
          tl.fromTo(q(".cur"), { x: 1150, y: 676 }, { x: 1300, y: 740, duration: 0.4, ease: "power2.out", immediateRender: false }, c + 0.3);
          window.__timelines["s02"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
