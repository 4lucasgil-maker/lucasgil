<!doctype html>
<html lang="pt-BR">
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        #s11 { position: absolute; inset: 0; font-family: Inter, sans-serif; color: #111b21; }
        #s11 .cam { position: absolute; inset: 0; }
        #s11 .line { position: absolute; left: 200px; top: 415px; width: 1520px; height: 12px; border-radius: 6px; background: #3b4a54; }
        #s11 .neg { position: absolute; left: 200px; top: 415px; width: 760px; height: 12px; border-radius: 6px; background: #e5484d; }
        #s11 .tick { position: absolute; top: 395px; width: 6px; height: 52px; border-radius: 3px; background: #3b4a54; }
        #s11 .zero { position: absolute; left: 930px; top: 452px; width: 60px; text-align: center; font-family: "League Gothic", sans-serif; font-size: 80px; line-height: 84px; color: #111b21; }
        #s11 .sg { position: absolute; top: 452px; width: 70px; text-align: center; font-family: "League Gothic", sans-serif; font-size: 90px; line-height: 84px; }
        #s11 .sm { left: 170px; color: #e5484d; } #s11 .sp { left: 1680px; color: #00a884; }
        #s11 .carw { position: absolute; left: 0; top: 0; width: 240px; height: 102px; }
        #s11 .ctag { position: absolute; left: 0; top: 0; width: 240px; text-align: center; font-family: "JetBrains Mono", monospace; font-weight: 700; font-size: 22px; line-height: 28px; letter-spacing: 2px; color: #3b4a54; }
        #s11 .big { position: absolute; left: 230px; top: 160px; font-family: "League Gothic", sans-serif; font-size: 120px; line-height: 124px; color: #e5484d; }
        #s11 .pp { position: absolute; top: 580px; width: 92px; height: 92px; }
      </style>
      <div id="s11" data-composition-id="s11" data-width="1920" data-height="1080">
        <div class="cam">
          <div class="big">NPS NEGATIVO</div>
          <div class="line"></div>
          <div class="neg"></div>
          <div class="ticks"></div>
          <div class="zero">0</div>
          <div class="sg sm">−</div><div class="sg sp">+</div>
          <div class="carw"><div class="carsvg"></div></div>
          <div class="ctag">TURMA DO CARRO</div>
          <div class="crowd"></div>
        </div>
      </div>
      <script>
        (function () {
          var W = [["Eu",0.153,0.393],["imagino",0.393,0.713],["que",0.713,0.873],["essa",0.873,1.033],["turma",1.033,1.433],["aqui",1.433,1.593],["de",1.593,1.673],["carro…",1.673,2.153],["tá",3.753,3.833],["com",3.833,3.913],["NPS",3.993,4.393],["negativo,",4.393,4.713],["porque",4.713,4.793],["deve",4.873,5.033],["ter",5.033,5.193],["muito",5.193,5.353],["mais",5.353,5.513],["gente.",5.513,5.913]];
          var T = VT.finder(W, "s11");
          var DUR = 5.75;
          var R = document.getElementById("s11");
          var q = function (s) { return R.querySelector(s); };
          var tk = q(".ticks");
          for (var i = 0; i <= 10; i++) tk.insertAdjacentHTML("beforeend", '<div class="tick" style="left:' + (197 + i * 152) + 'px"></div>');
          q(".carsvg").innerHTML = VT.car({ width: 240, color: "#fbfaf7" });
          var cr = q(".crowd");
          for (var r = 0; r < 8; r++) cr.insertAdjacentHTML("beforeend", '<div class="pp pr' + r + '" style="left:' + (210 + r * 92) + 'px">' + VT.person({ size: 84, bg: "#e5484d" }) + "</div>");
          for (var g = 0; g < 3; g++) cr.insertAdjacentHTML("beforeend", '<div class="pp pg' + g + '" style="left:' + (1240 + g * 120) + 'px">' + VT.person({ size: 84, bg: "#00a884" }) + "</div>");
          // posição do carro (x do canto esquerdo) como função do tempo
          var tc = T("carro"), tn = T("negativo");
          var KX = [[0, 1560], [tc - 0.6, 1560], [tc + 0.2, 840, "out"], [tn - 0.2, 840], [tn + 0.35, 330, "out"], [DUR, 300, "lin"]];
          var KB = [[0, 0], [tc + 0.2, 0], [tc + 0.5, -14, "out"], [tc + 0.8, 0, "in"], [tc + 1.3, -10, "out"], [tc + 1.6, 0, "in"], [DUR, 0]];
          var carw = q(".carw"), ctag = q(".ctag");
          var tl = gsap.timeline({ paused: true });
          VT.driver(tl, DUR, function (t) {
            var x = VT.kf(t, KX), b = VT.kf(t, KB);
            carw.style.transform = "translate(" + x.toFixed(1) + "px," + (323 + b).toFixed(1) + "px)";
            ctag.style.transform = "translate(" + x.toFixed(1) + "px,280px)";
          });
          tl.fromTo([q(".line"), q(".ticks")], { scaleX: 0, transformOrigin: "50% 50%" }, { scaleX: 1, duration: 0.5, ease: "power3.out" }, 0.05);
          tl.fromTo([q(".zero"), q(".sm"), q(".sp")], { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.3, stagger: 0.06 }, 0.3);
          tl.fromTo(carw, { opacity: 0 }, { opacity: 1, duration: 0.3 }, T("turma") - 0.4);
          tl.fromTo(ctag, { opacity: 0 }, { opacity: 1, duration: 0.3 }, T("turma") - 0.2);
          tl.to(ctag, { opacity: 0, duration: 0.2 }, tn - 0.3);
          // negativo
          tl.fromTo(q(".neg"), { scaleX: 0, transformOrigin: "100% 50%" }, { scaleX: 1, duration: 0.45, ease: "power3.out" }, tn - 0.15);
          tl.fromTo(q(".big"), { opacity: 0, x: -60, skewX: -12 }, { opacity: 1, x: 0, skewX: 0, duration: 0.35, ease: "power4.out" }, T("NPS") - 0.1);
          tl.fromTo(q(".cam"), { x: 0 }, { x: 120, duration: 0.6, ease: "power2.inOut" }, tn - 0.1);
          // muito mais gente
          for (var a = 0; a < 8; a++) tl.fromTo(q(".pr" + a), { opacity: 0, y: 50, scale: 0.5 }, { opacity: 1, y: 0, scale: 1, duration: 0.3, ease: "back.out(2.4)" }, T("muito") - 0.2 + a * 0.05);
          for (var c = 0; c < 3; c++) tl.fromTo(q(".pg" + c), { opacity: 0, y: 50, scale: 0.5 }, { opacity: 1, y: 0, scale: 1, duration: 0.3, ease: "back.out(2.4)" }, T("muito") + c * 0.08);
          window.__timelines["s11"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
