              var t0 = Math.max(0, g.start - 0.14);
              tl.fromTo(el, { opacity: 0, y: 46, scale: 0.94, visibility: "visible", transformOrigin: g.in ? "0% 100%" : "100% 100%" },
                { opacity: 1, y: 0, scale: 1, visibility: "visible", duration: 0.3, ease: "back.out(1.6)" }, t0);
              if (!g.voice) {
                var ws = el.querySelectorAll(".w");
                g.words.forEach(function (w, j) {
                  tl.fromTo(ws[j], { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.14, ease: "power2.out" }, Math.max(t0, w[1] - 0.05));
                  if (w[3]) {
                    tl.fromTo(ws[j], { backgroundSize: "0% 42%" }, { backgroundSize: "100% 42%", duration: 0.28, ease: "power2.out", immediateRender: false }, Math.max(t0, w[1] + 0.04));
                    tl.fromTo(ws[j], { scale: 1 }, { scale: 1.12, duration: 0.12, ease: "power2.out", yoyo: true, repeat: 1, immediateRender: false }, Math.max(t0, w[1] + 0.02));
                  }
                });
              }
              var blue = el.querySelector(".tk-blue");
              if (blue) {
                tl.to(blue, { opacity: 1, duration: 0.2 }, g.end + 0.35);
              }
              var nx = els[n + 1];
              if (nx) {
                var tn = Math.max(0, nx.g.start - 0.14);
                tl.to(el, { y: -(H[n + 1] + 26), opacity: 0, duration: 0.32, ease: "power2.inOut" }, tn);
                tl.set(el, { opacity: 0, visibility: "hidden" }, tn + 0.34);
              }
            });
            window.__timelines["captions"] = tl;
          };
          document.fonts.ready.then(build);
        })();
      </script>
    </template>
  </body>
</html>
