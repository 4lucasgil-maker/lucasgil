<!doctype html>
<html lang="pt-BR">
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        #s48 { position: absolute; inset: 0; font-family: Inter, sans-serif; color: #111b21; }
        #s48 .cam { position: absolute; inset: 0; }
        #s48 .wand { position: absolute; left: 520px; top: 200px; width: 360px; height: 360px; transform-origin: 10% 90%; }
        #s48 .mg { position: absolute; left: 900px; top: 230px; font-family: "League Gothic", sans-serif; font-size: 170px; line-height: 170px; color: #c9a55c; }
        #s48 .mg small { display: block; font-family: "JetBrains Mono", monospace; font-weight: 700; font-size: 28px; line-height: 36px; letter-spacing: 5px; color: #3b4a54; }
        #s48 .spk { position: absolute; width: 50px; height: 50px; color: #c9a55c; }
        #s48 .smoke { position: absolute; width: 70px; height: 70px; border-radius: 50%; background: #cbc1b2; opacity: 0; }
        #s48 .car { position: absolute; left: 0; top: 330px; width: 3000px; height: 320px; }
        #s48 .rv { position: absolute; top: 0; width: 420px; height: 300px; border-radius: 30px; background: #fbfaf7; box-shadow: 0 14px 30px rgba(17, 27, 33, 0.14); }
        #s48 .rv .av { position: absolute; left: 28px; top: 26px; width: 70px; height: 70px; }
        #s48 .rv .nm { position: absolute; left: 116px; top: 40px; width: 160px; height: 16px; border-radius: 8px; background: #3b4a54; opacity: 0.7; }
        #s48 .rv .stars { position: absolute; left: 28px; top: 120px; display: flex; gap: 8px; }
        #s48 .rv .st { width: 40px; height: 40px; color: #cbc1b2; }
        #s48 .rv .st1 { color: #c9a55c; }
        #s48 .rv .l1 { position: absolute; left: 28px; top: 190px; width: 340px; height: 14px; border-radius: 7px; background: #cbc1b2; }
        #s48 .rv .l2 { position: absolute; left: 28px; top: 222px; width: 240px; height: 14px; border-radius: 7px; background: #cbc1b2; }
        #s48 .stamp { position: absolute; left: 790px; top: 420px; padding: 4px 26px; border: 10px solid #e5484d; border-radius: 22px; color: #e5484d; font-family: "League Gothic", sans-serif; font-size: 110px; line-height: 112px; background: rgba(251, 250, 247, 0.85); }
        #s48 .rl { position: absolute; left: 0; top: 200px; width: 1920px; text-align: center; font-family: "JetBrains Mono", monospace; font-weight: 700; font-size: 30px; line-height: 38px; letter-spacing: 6px; color: #3b4a54; }
      </style>
      <div id="s48" data-composition-id="s48" data-width="1920" data-height="1080">
        <div class="cam">
          <svg class="wand" width="360" height="360" viewBox="0 0 360 360" aria-hidden="true">
            <path d="M40 320 L250 110" stroke="#111b21" stroke-width="22" stroke-linecap="round"/>
            <path d="M40 320 L80 280" stroke="#fbfaf7" stroke-width="14" stroke-linecap="round"/>
            <path class="star" d="M270 40 L289 78 L331 84 L301 113 L308 155 L270 135 L232 155 L239 113 L209 84 L251 78 Z" fill="#c9a55c" stroke="#111b21" stroke-width="6" stroke-linejoin="round"/>
          </svg>
          <div class="mg">MÁGICO<small>DA INDÚSTRIA</small></div>
          <div class="spks"></div>
          <div class="smoke m0" style="left:770px;top:180px"></div><div class="smoke m1" style="left:820px;top:150px"></div><div class="smoke m2" style="left:740px;top:140px"></div>
          <div class="rl">RELATOS</div>
          <div class="car" data-layout-ignore></div>
          <div class="stamp">RUIM</div>
        </div>
      </div>
      <script>
        (function () {
          var W = [["Gente,",0.153,0.633],["esse",0.633,0.873],["era",0.873,1.113],["pra",1.113,1.273],["ser",1.273,1.513],["o",1.513,1.753],["momento",1.753,2.073],["mágico",2.153,2.793],["da",2.793,2.953],["indústria.",2.953,3.593],["E",3.593,3.753],["aparentemente,",3.753,4.313],["pelos",4.313,4.553],["relatos",4.553,4.873],["que",4.953,5.033],["eu",5.033,5.113],["tive",5.113,5.353],["aqui,",5.353,5.513],["isso",5.513,5.673],["é",6.013,6.173],["muito",6.173,6.333],["comum,",6.333,6.653],["ser",6.653,6.893],["uma",6.893,7.053],["experiência",7.053,7.453],["ruim.",7.453,7.853]];
          var T = VT.finder(W, "s48");
          var DUR = 7.86;
          var R = document.getElementById("s48");
          var q = function (s) { return R.querySelector(s); };
          var spks = q(".spks");
          var SP = [[700, 160], [880, 150], [760, 420], [640, 260], [960, 380], [820, 300]];
          SP.forEach(function (p, i) { spks.insertAdjacentHTML("beforeend", '<div class="spk k' + i + '" style="left:' + p[0] + "px;top:" + p[1] + 'px">' + VT.icon("spark", { size: 50, stroke: 2.6 }) + "</div>"); });
          // carrossel de relatos (1 estrela de 5, sem números)
          var car = q(".car"), BG = ["#3f5b67", "#c9a55c", "#005c4b", "#54656f", "#1b2a30", "#00a884", "#3b4a54"];
          for (var c = 0; c < 7; c++) {
            var st = "";
            for (var s = 0; s < 5; s++) st += '<div class="st' + (s === 0 ? " st1" : "") + '">' + VT.icon("star", { size: 40, stroke: 2, fill: s === 0 }) + "</div>";
            car.insertAdjacentHTML("beforeend", '<div class="rv r' + c + '" style="left:' + c * 450 + 'px"><div class="av">' + VT.person({ size: 70, bg: BG[c] }) + '</div><div class="nm"></div><div class="stars">' + st + '</div><div class="l1"></div><div class="l2"></div></div>');
          }
          var trl = T("relatos") - 0.6;
          var tl = gsap.timeline({ paused: true });
          VT.driver(tl, DUR, function (t) {
            var u = Math.max(0, t - trl);
            var x = 1920 - Math.min(1, u / 0.6) * 1500 - Math.max(0, u - 0.6) * 140;
            car.style.transform = "translateX(" + x.toFixed(1) + "px)";
          });
          // momento mágico: a varinha brilha
          tl.fromTo(q(".wand"), { opacity: 0, rotation: -60 }, { opacity: 1, rotation: 0, duration: 0.45, ease: "back.out(2)" }, T("momento") - 0.45);
          tl.fromTo(q(".mg"), { opacity: 0, scale: 0.7 }, { opacity: 1, scale: 1, duration: 0.35, ease: "back.out(2.4)" }, T("mágico") - 0.15);
          SP.forEach(function (p, i) {
            tl.fromTo(q(".k" + i), { opacity: 0, scale: 0, rotation: -90 }, { opacity: 1, scale: 1, rotation: 0, duration: 0.25, ease: "back.out(3)" }, T("mágico") - 0.1 + i * 0.05);
          });
          // da indústria… e falha: a estrela cai, faíscas apagam, fumaça
          var tf = T("indústria") + 0.2;
          tl.to(q(".wand"), { rotation: 35, duration: 0.5, ease: "bounce.out" }, tf);
          SP.forEach(function (p, i) { tl.to(q(".k" + i), { y: 260, opacity: 0, rotation: 90, duration: 0.5, ease: "power2.in" }, tf + i * 0.04); });
          ["m0", "m1", "m2"].forEach(function (m, i) {
            tl.fromTo(q("." + m), { opacity: 0.8, scale: 0.4, y: 0 }, { opacity: 0, scale: 1.6, y: -80, duration: 0.8, ease: "power1.out", immediateRender: false }, tf + 0.1 + i * 0.1);
          });
          tl.to(q(".mg"), { color: "#54656f", duration: 0.4 }, tf);
          tl.to([q(".wand"), q(".mg")], { opacity: 0, y: -60, duration: 0.35, ease: "power2.in" }, trl - 0.2);
          // relatos: muitos, todos ruins
          tl.fromTo(q(".rl"), { opacity: 0 }, { opacity: 1, duration: 0.25 }, T("relatos") - 0.1);
          tl.fromTo(q(".stamp"), { opacity: 0, scale: 2.4, rotation: -4 }, { opacity: 1, scale: 1, rotation: -10, duration: 0.2, ease: "power4.in" }, T("ruim") - 0.12);
          tl.fromTo(q(".cam"), { scale: 1 }, { scale: 1.04, duration: 0.12, yoyo: true, repeat: 1, ease: "power2.out", immediateRender: false }, T("ruim") + 0.08);
          window.__timelines["s48"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
